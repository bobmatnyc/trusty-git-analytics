# Standalone repository (split from trusty-tools at 1c1ce516a). This root
# manifest is both the `tga` package and the workspace, ripgrep-style.
[workspace]
members = [".", "crates/trusty-audit"]
# A bare `cargo build` / `test` / `clippy` covers both crates, as it did in the
# monorepo's `default-members`.
default-members = [".", "crates/trusty-audit"]
# The trusty-audit Tauri GUI needs the pnpm/Svelte toolchain (and WebKitGTK on
# Linux), so it stays out of the workspace and out of every headless gate.
exclude = ["crates/trusty-audit/ui"]
resolver = "2"

[workspace.package]
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/bobmatnyc/trusty-git-analytics"
authors = ["Bob Matsuoka <bob@matsuoka.com>"]

# Dependencies BOTH crates take, pinned once so tga and trusty-audit cannot
# drift apart. Versions are the ones trusty-tools resolved at 1c1ce516a;
# crate-specific dependencies are written out in each crate's own manifest.
[workspace.dependencies]
# Published crates.io releases, never path or git (split plan). Each crate adds
# its own feature list.
trusty-common = "0.52"
trusty-progress = "0.3.2"
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
dirs = "5.0.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
thiserror = "1.0.69"
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.8.23"
toml_edit = "0.22.27"
# Test-only for tga, a normal dependency of trusty-audit.
tempfile = "3.27.0"
# `file_locks` supplies `#[file_serial]`, the cross-process lock trusty-audit's
# tests need under nextest.
serial_test = { version = "3.4.0", features = ["file_locks"] }
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = "thin"

[package]
name = "tga"
# #5219: MINOR bump from the published 3.0.0, required in-PR by the #4421 gate
# because `src/**` changed under an already-published version. The change is
# breaking for external library consumers — `PmTicket`, `GithubConfig` and
# `JiraConfig` each gain a field and `#[non_exhaustive]` — so standard SemVer
# would put it at MAJOR. Minor is a standing owner decision, reaffirmed after
# that was pointed out; `preflight-publish.sh` CHECK 5 will demand the major and
# needs a deliberate override at release.
#
# #5250: the preceding 2.20.0 → 3.0.0 was MAJOR. `AgenticMode` gained an
# `Unknown` variant AND `#[non_exhaustive]`; both break an exhaustive downstream
# `match`. Superseded the #4421 patch bump that carried 2.19.0 → 2.20.0.
#
# 3.1.0 → 3.1.1 carried no code change. The `tga-v3.1.0` tag is pinned by a
# protected ruleset to 43bfd64f1, and that commit contains the #6027 doc-link
# regression, so it can never pass the pre-publish gate. A tag cannot be moved,
# so the release moves forward to a gate-clean commit instead.
#
# 3.1.1 → 3.2.0, and neither 3.1.0 nor 3.1.1 was ever published; both tags stay
# orphaned. `cargo-semver-checks` reports the delta against the published 3.0.0
# baseline as breaking — `constructible_struct_adds_field` on
# `DdRepositoryEntry.authorship` and `struct_marked_non_exhaustive` on
# `GithubConfig`, `JiraConfig` and `PmTicket`. Owner ruling 2026-08-19: no major
# bump. tga's library API has no external linking consumers (it is consumed as
# the `tga` binary; trusty-audit resolves it by version at runtime, not through
# a Cargo edge), so the gate has nobody to protect here. The exception is
# recorded as a `tga` row in scripts/semver-checks-crate-exclusions.tsv.
#
# 4.0.0 → 4.0.1 (#5775): six config credentials stop serializing in the clear.
# PATCH — the derives change but the API surface does not: the same six structs
# still implement `Serialize` over the same fields, with the same names and the
# same types. What changes is the value written for a credential.
#
# 4.0.1 → 4.0.2 (#6300): no code change. `tga-v4.0.1` is pinned by a protected
# ruleset (#6178) to 8d9e5cfb9, and this branch's exclusion-row removal lands
# after it, so `preflight-publish.sh` CHECK 6 (tag/publish commit parity) can
# never be satisfied at that tag. 4.0.1 is a burned version number and the
# release moves forward to a gate-clean commit.
#
# 5.0.0 → 5.0.1 (#6405): the unsynchronized env-mutation family closes out. The
# credential-lookup seam is additive — every existing `pub fn` keeps its
# signature and delegates to a `pub(crate)` `_with_creds` variant — so nothing
# in the public API breaks. PATCH.
# 5.0.1 → 5.0.2 (#4293): deterministic-ordering fix for alias collisions in
# identity resolution, plus routing the team-config constructor through the
# same alias contract. No public signature changes — `cargo-semver-checks`
# reports no semver update required. PATCH.
# 5.0.2 → 5.0.3 (issue #4421, post-publish wave 2026-09-01): patch — 5.0.2 is
# already live on crates.io and #6564 edits `src/**` under it. Bumped on
# `main` first so the `PR version bump vs crates.io` gate clears once #6564
# updates its branch onto this commit.
# 5.0.3 -> 6.0.0 (#6695, 2026-09-02 cut): MAJOR. `preflight-publish.sh` CHECK 5
# refused 5.0.3 against 5.0.2 with `constructible_struct_adds_field` on
# `CollectionStats.repos_skipped` (src/collect/collector.rs:106). The struct is
# publicly constructible and carries no `#[non_exhaustive]`, so a downstream
# struct literal stops compiling. Post-1.0, a break sits in the MAJOR position.
# 6.0.0 -> 6.0.1 (#3916): PATCH. Adds a new `backfill pm-work` subcommand and a
# new config table; nothing existing is removed or changed. `src/**` changed
# while 6.0.0 was already live on crates.io, so the `PR version bump vs
# crates.io` gate (#4421) requires the bump.
# 7.1.2 -> 8.0.0 (#6812): MAJOR. Migrating the JIRA search off the retired
# `/rest/api/3/search` moves `collect::jira::paging::PageRequest` from a
# `startAt` offset to `/search/jql`'s continuation token, which
# `cargo-semver-checks` reports as two breaks — `struct_pub_field_missing` on
# `PageRequest.start_at` and `constructible_struct_adds_field` on
# `PageRequest.next_page_token`. Post-1.0, a break sits in the MAJOR position.
# Only trusty-analyze takes a Cargo edge on tga, and it pins by path with no
# version requirement, so nothing in-workspace has to move with it.
# 8.0.0 -> 8.0.1 (owner ruling 2026-09-23): PATCH. tga now lives in
# bobmatnyc/trusty-git-analytics (split from bobmatnyc/trusty-tools) and
# depends on published trusty-common/trusty-progress crates.io releases
# rather than in-workspace paths. No functional change from 8.0.0 beyond
# moving the two agentic-detection corpus tests onto a recorded history
# fixture; see CHANGELOG.md. This is tga's first release from this
# repository — publishing waits until tga 8.0.0 ships from trusty-tools.
# 8.0.1 -> 9.0.0 (owner ruling 2026-09-24): MAJOR, superseding the unpublished
# 8.0.1 (never tagged). #111/#131/#133 land three breaking changes since:
# `#[non_exhaustive]` on the public command/value enums (a downstream `match`
# needs a wildcard arm), `persist_weekly_engineer`/`persist_weekly_quality`
# gaining a required `scope: PersistScope` parameter, and the merge-commit
# exclusion changing every reported total. Post-1.0, a break sits in the
# MAJOR position; see CHANGELOG.md.
version = "10.0.0"
publish = true
edition = "2021"
# Aligned with the workspace MSRV (1.94) per #254. Required for
# `std::sync::LazyLock` (CLI help wiring, issue #216). The effective workspace
# floor is now 1.94 (aws-config/aws-sdk-bedrockruntime declare 1.94.1);
# aligning prevents MSRV drift.
rust-version = "1.94"
authors = ["Bob Matsuoka <bob@matsuoka.com>"]
license.workspace = true
repository.workspace = true
description = "Developer productivity analytics — git commit collection, classification, and reporting"
homepage = "https://trustytools.dev"
keywords = ["git", "analytics", "productivity", "developer-metrics"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    ".claude/*",
    ".claude-mpm/*",
    ".fastembed_cache/*",
    ".github/*",
    "configs/*",
    # The 9 MB recorded-history corpus and the two tests that read it stay in
    # the repository only; a crates.io tarball ships neither.
    "tests/fixtures/*",
    "tests/corpus_fixture/*",
    "tests/agentic_detection_corpus.rs",
    "tests/agentic_detection_corpus_configured.rs",
    # #111: reads the same corpus plus its golden dump from tests/fixtures.
    "tests/classify_byte_identical.rs",
]

[[bin]]
name = "tga"
path = "src/main.rs"

[dependencies]
# Shared CLI help system (issue #216): declarative `help.yaml` loader +
# Jaro-Winkler "did you mean?" suggester. `cli-help`/`update-check`/`config-cli`
# are always on; `bedrock-client` (the shared Converse adapter, #2407) is added
# only under tga's own `bedrock` feature below (#2411) so the AWS SDK stack
# stays opt-in.
# `monitor-tui` (#5197) is what gives the `tga tui` subcommand the shared
# `enter_tui` / `leave_tui` terminal glue in `trusty_common::monitor::tui_common`,
# so tga does not grow a second copy of the raw-mode dance. It turns on
# ratatui + crossterm in trusty-common at the SAME workspace versions tga pins
# below — one ratatui major in the build graph.
# `inference-client` (#5464) is what `profile::batch_reviewer::PeriodReviewer`
# sends its period-review call through — the workspace's one inference entry
# point, so contributor profiling reaches a model without tga taking a Cargo
# edge to trusty-review. `config-cli` already implied it transitively; naming it
# here makes the dependency the profile transport relies on explicit rather than
# a side effect of the `config` subcommand staying mounted.
# `credentials` (#5983) is the same shape: `collect::linear::client` resolves its
# API key through `trusty_common::credentials::resolve_key` and scrubs error
# bodies with `scrub_secrets`, both of which sit behind that feature and both of
# which arrived here transitively until now.
trusty-common = { workspace = true, features = ["cli-help", "update-check", "config-cli", "credentials", "inference-client", "monitor-tui", "uds"] }
# Async runtime
tokio = { workspace = true }
# IANA timezone database: JQL date literals are evaluated in the JIRA
# account's profile timezone, so the sync bound must be rendered in it
# (issue #3966; see collect::jira::jql_time).
chrono-tz = "0.9.0"
# CLI
clap = { workspace = true }
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# #5236: the DD manifest handed to trusty-review is a TOML file (DOC-67 §6);
# the file IS the seam, so tga serializes it rather than taking a Cargo edge.
toml = { workspace = true }
# #6190: trusty-audit writes its own keys into that same file, so a re-run
# merges into the document rather than replacing it. `toml_edit` is what
# preserves the keys, tables, and formatting this crate does not own — a
# `toml::Value` round trip would rewrite every one of them.
toml_edit = { workspace = true }
# Database
# MUST MATCH: rusqlite 0.39 (libsqlite3-sys 0.37) is the line the rest of the
# trusty crates use. Cargo's `links = "sqlite3"` uniqueness rule forbids two
# copies of libsqlite3-sys in one build graph, so a different major here fails
# resolution the day any trusty dependency starts linking SQLite.
# `bundled` means no system SQLite; `chrono` is for typed `DateTime<Utc>` row
# binding.
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
# Git
# git2's defaults are off; tga names exactly the transports it needs.
# The `https` and `vendored-openssl` features are here (#337) so `tga collect`
# can fetch from https:// remotes without an external system git:
#   - macOS: uses the native Security framework (no openssl runtime dep)
#   - Linux: vendors openssl statically (portable binaries, no system libssl)
#   - Windows: uses Schannel (no openssl runtime dep)
# #6782: `ssh` links libssh2, without which libgit2 rejects every
# `git@host:org/repo.git` / `ssh://` origin with `unsupported URL protocol;
# class=Net (12)` — 59 of 59 repositories in a client audit — and the sweep
# then walks clone-time refs. libssh2-sys vendors libssh2 from its own bundled
# source, and `vendored-openssl` already propagates to it, so this adds no
# system library and no new runtime dependency.
git2 = { version = "0.20.4", default-features = false, features = ["vendored-libgit2", "https", "ssh", "vendored-openssl"] }
# HTTP client — the workspace entry declares
# `default-features = false, features = ["json", "stream", "rustls-tls"]`,
# a superset of what tga needs; `stream` is unused here but shared with
# trusty-audit.
reqwest = { workspace = true }
# Parallelism
rayon = "1.12.0"
# Date/time
chrono = { workspace = true }
# Per-user data directory. #5463: `profile::selector::resolve_db_path` falls
# back to `<data-dir>/tga/tga.db`, which is `~/Library/Application Support` on
# macOS and `~/.local/share` on Linux — a distinction a bare `$HOME` join would
# get wrong on one of the two.
dirs = { workspace = true }
# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
# Regex / pattern matching
regex = "1.12.3"
aho-corasick = "1.1.4"
# String similarity (identity fuzzy matching)
strsim = "0.11.1"
# Logging / tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
# Progress bars. The 0.17 line is the one trusty-progress renders through.
indicatif = "0.17.11"
# #5823: the cross-process progress wire format `trusty-audit` parses back.
# Both ends name `trusty_progress::relay` rather than each spelling the grammar,
# so the format cannot drift between producer and consumer. It brings no new
# transitive weight — its only dependencies are indicatif (already here) and
# thiserror.
trusty-progress = { workspace = true }
# TUI (#5197): `tga tui`.
# MUST MATCH trusty-common: its `monitor-tui` feature (enabled above) pulls
# ratatui 0.30 / crossterm 0.29, and `tga tui` hands its terminal to
# `trusty_common::monitor::tui_common`. A different minor here puts two ratatui
# or crossterm copies in the graph whose types do not unify. Move these only
# together with the trusty-common requirement.
ratatui = "0.30"
crossterm = "0.29"
# UUID
uuid = { version = "1.23.1", features = ["v4", "v5", "v7", "serde"] }
# Hashing (config hash)
blake3 = "1.8.5"
# CSV generation
csv = "1.4.0"
# Template engine (for markdown reports)
tera = "1.20.1"
# Async trait
async-trait = "0.1.89"
# Async stream combinators (for bounded-concurrency LLM fallback)
futures = "0.3.32"

[features]
default = []
# Enable the AWS Bedrock LLM classifier provider. Without this feature,
# `--provider bedrock` returns a configuration error explaining the build.
#
# As of #2411 the Bedrock wire integration (region resolution, the AWS
# credential chain, and the Converse request/response conversion) is no longer
# a private aws-sdk port here — it bridges onto the shared
# `trusty_common::inference::bedrock` Converse adapter (#2407), so this feature
# just turns on the commons `bedrock-client` feature, which pulls the AWS SDK
# stack in ONE place. The direct `aws-config`/`aws-sdk-bedrockruntime` deps
# were dropped.
bedrock = ["trusty-common/bedrock-client"]

[dev-dependencies]
# HTTP mocking for async reqwest tests
wiremock = { workspace = true }
# Statistical benchmarking
criterion = { version = "0.5.1", features = ["html_reports"] }
# Capture tracing events in tests (used by ticket_regex warn-log assertions)
tracing-test = "0.2.6"
# Temporary files for rule-loader tests
tempfile = { workspace = true }
# #5463: the `TGA_DB` resolution tests in `profile::selector` mutate the
# environment, which is process-global — `#[serial]` keeps them off the other
# test threads for the duration.
serial_test = { workspace = true }

[[bench]]
name = "tga_bench"
harness = false
