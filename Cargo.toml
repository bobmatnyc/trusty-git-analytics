[package]
name = "tga"
version = "0.2.0"
edition = "2021"
authors = ["Bob Matsuoka <bob@matsuoka.com>"]
license = "Elastic-2.0"
repository = "https://github.com/bobmatnyc/trusty-git-analytics"
description = "Developer productivity analytics — git commit collection, classification, and reporting"
keywords = ["git", "analytics", "productivity", "developer-metrics"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    ".claude/*",
    ".claude-mpm/*",
    ".fastembed_cache/*",
    ".github/*",
    "docs/*",
    "configs/*",
]

[[bin]]
name = "tga"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# CLI
clap = { version = "4", features = ["derive", "env"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
# Git
git2 = "0.19"
# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
# Parallelism
rayon = "1"
# Date/time
chrono = { version = "0.4", features = ["serde"] }
# Error handling
anyhow = "1"
thiserror = "1"
# Regex / pattern matching
regex = "1"
aho-corasick = "1"
# String similarity (identity fuzzy matching)
strsim = "0.11"
# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Progress bars
indicatif = "0.17"
# UUID
uuid = { version = "1", features = ["v4", "serde"] }
# Hashing (config hash)
blake3 = "1"
# CSV generation
csv = "1"
# Template engine (for markdown reports)
tera = "1"
# Async trait
async-trait = "0.1"

[dev-dependencies]
# HTTP mocking for async reqwest tests
wiremock = "0.6"
