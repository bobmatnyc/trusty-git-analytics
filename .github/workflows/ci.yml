# CI for the standalone trusty-git-analytics repo (split-plan step 6).
#
# Repo root = the `tga` crate (binary `tga`). `crates/trusty-audit` = the
# `trusty-audit` crate (binaries `trusty-audit` + `taudit`). Root Cargo.toml
# declares `[workspace] members = [".", "crates/trusty-audit",
# "crates/trusty-audit/ui/src-tauri"]` (ripgrep-style — the workspace root is
# itself a member). The third is the Tauri GUI (package `trusty-audit-ui`),
# which moved here from trusty-tools. It is absent from `default-members` and
# every `--workspace` command below passes `--exclude trusty-audit-ui`: it
# needs WebKitGTK on Linux, which these runners do not install.
#
# Trimmed down from trusty-tools' ci.yml on purpose: that workflow's
# complexity (docs-only diff classification, 8-way test sharding, fastembed
# model caching, four dedicated Tauri-GUI jobs, a red-main tracking issue) all
# exists to pay for a 20+ crate / multi-GUI monorepo. Two crates, no bundled
# ONNX/UI-embedding, no Tauri member: none of that machinery earns its keep
# here. Reintroduce a piece of it only when this repo's own CI time or false-
# green history justifies it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PR: one run per PR ref, superseded by each new push (saves CI minutes).
  # push to main: keyed to the commit, never cancelled — the commit is
  # already on main, so there is nothing to save by killing its own check run.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # fmt — cargo fmt --all --check (stable + rustfmt component).
  # ---------------------------------------------------------------------------
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # clippy — deny warnings across the whole workspace (both crates, all
  # targets). `--workspace` covers `.` (tga) and `crates/trusty-audit`;
  # `--exclude trusty-audit-ui` skips the Tauri GUI (see file-header comment).
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --workspace --exclude trusty-audit-ui --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # audit-ui — clippy- and test-verify the auditor client's Tauri desktop shell
  # (crates/trusty-audit/ui/src-tauri, package `trusty-audit-ui`), which the
  # `clippy` job above excludes (see this file's header comment).
  #
  # Ported from trusty-tools' `trusty-audit-ui clippy` job when the crate
  # moved to this repo (bobmatnyc/trusty-tools@279e12668
  # .github/workflows/ci.yml), so the extraction does not silently drop that
  # gate. Same check name on purpose, so it can be made a required check here
  # too. Two adaptations from the source job:
  #   - No `needs: [changes]` / docs-only gating: tga has no diff classifier
  #     (see file header), so this job always runs on its own triggers below
  #     and adds no `needs:` to any other job.
  #   - Plain `apt-get install`, not `scripts/ci-apt-install.sh`: that
  #     script's retry/infra-classification wrapper (trusty-tools issues
  #     #5999, #7288) does not exist in this repo; same package list as the
  #     source step.
  #
  # Tauri links WebKit2GTK on Linux, so this job installs that toolchain and
  # compiles + lints the crate on its own runner.
  # `tauri::generate_context!()` embeds `frontendDist` ("../dist") at compile
  # time and hard-errors when it is absent; `dist/` is gitignored, so a
  # placeholder index.html is stubbed before clippy, exactly as the source
  # job did. `SKIP_UI_BUILD=1` stops build.rs from looking for pnpm, so this
  # job never touches Node/pnpm (the source job did not either).
  # ---------------------------------------------------------------------------
  audit-ui:
    name: trusty-audit-ui clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: audit-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Stub the frontendDist so tauri::generate_context!() can embed it.
      # SKIP_UI_BUILD=1 below stops build.rs looking for pnpm.
      - name: Stub frontend dist for generate_context!
        run: |
          mkdir -p crates/trusty-audit/ui/dist
          printf '<!doctype html><html><head><meta charset="utf-8"><title>trusty-audit</title></head><body></body></html>\n' \
            > crates/trusty-audit/ui/dist/index.html

      - name: cargo clippy -p trusty-audit-ui --all-targets -- -D warnings
        env:
          SKIP_UI_BUILD: "1"
        run: cargo clippy -p trusty-audit-ui --all-targets -- -D warnings

      - name: cargo test -p trusty-audit-ui
        env:
          SKIP_UI_BUILD: "1"
        run: cargo test -p trusty-audit-ui

  # ---------------------------------------------------------------------------
  # test — cargo test --workspace for both crates.
  #
  # fetch-depth: 0 (full clone): tga's collect/ module extracts real commit
  # history via git2, and several of its 37 unit tests + the gated integration
  # test build small real repos or read this checkout's own git log. A shallow
  # clone risks a test that assumes history depth it does not have. Drop this
  # to the default shallow checkout if triage shows no test actually needs it.
  # ---------------------------------------------------------------------------
  test:
    name: Test (tga + trusty-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo test --workspace --exclude trusty-audit-ui

  # ---------------------------------------------------------------------------
  # msrv — cargo check --workspace on the declared floor (1.94), matching
  # tga's rust-toolchain.toml / clippy.toml. `cargo check`, not `test`: the
  # MSRV guarantee is that the code compiles on the minimum toolchain, not
  # that tests pass on it.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV check (1.94)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.94

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1-94
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo check --workspace --exclude trusty-audit-ui

  # ---------------------------------------------------------------------------
  # dependency-duplicates — plan risk item: tga and trusty-audit no longer
  # share a `trusty-common` crate to unify their dependency graph on one
  # ratatui major / one rusqlite+libsqlite3-sys pair (Cargo's `links = "sqlite3"`
  # uniqueness rule forbids two copies of libsqlite3-sys in one build graph
  # outright — a real build break, not a lint). Once trusty-audit and tga are
  # each other's only workspace siblings, nothing but this check stops their
  # ratatui/rusqlite version pins from drifting apart. `cargo tree -d` lists
  # every package that resolves to more than one version in the graph.
  # ---------------------------------------------------------------------------
  dependency-duplicates:
    name: Dependency graph — no duplicate ratatui / libsqlite3-sys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: dep-dupes
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo tree -d
        run: |
          set -uo pipefail
          OUT="$(cargo tree --workspace --exclude trusty-audit-ui -d 2>&1)"
          RC=$?
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo "::error::cargo tree -d exited ${RC} — could not compute the dependency graph."
            exit 1
          fi
          if echo "$OUT" | grep -E '^(ratatui|crossterm|libsqlite3-sys) v'; then
            echo "::error::Duplicate ratatui, crossterm, or libsqlite3-sys versions in the dependency graph. tga and trusty-audit must agree on one ratatui/crossterm major and one rusqlite/libsqlite3-sys version — see this job's header comment and docs/release-assets.md."
            exit 1
          fi
          echo "OK — no duplicate ratatui, crossterm, or libsqlite3-sys version in the graph."
