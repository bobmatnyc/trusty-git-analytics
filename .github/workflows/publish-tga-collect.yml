# Publishes the tga-collect crate to crates.io.
#
# Triggered by:
#   - Push of a tag matching tga-collect-v* (e.g. tga-collect-v0.1.0)
#   - Manual workflow_dispatch (with optional dry-run mode)
#
# Pipeline stages:
#   1. Dry-run gate  — cargo publish --dry-run -p tga-collect
#   2. Clippy gate   — cargo clippy -p tga-collect -- -D warnings
#   3. Publish       — cargo publish -p tga-collect
#
# Publish order across the workspace:
#   1. tga-core         (must be on crates.io first)
#   2. tga-collect      (this workflow), tga-classify, tga-report (parallel)
#   3. tga-cli          (depends on all four)
#
# PREREQUISITE: tga-core must already be published to crates.io at a version
# compatible with this crate's path/version dependency. The dry-run gate
# below will fail if tga-core is missing from the index.
#
# Required repository secret:
#   CARGO_REGISTRY_TOKEN — crates.io API token with publish scope for tga-collect.

name: Publish tga-collect

on:
  push:
    tags:
      - "tga-collect-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (publish --dry-run, skip actual upload)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: Publish tga-collect to crates.io
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      # ── Prerequisite check ────────────────────────────────────────────────
      - name: Verify tga-core is on crates.io
        run: |
          if ! cargo search tga-core --limit 1 | grep -q '^tga-core '; then
            echo "ERROR: tga-core is not published to crates.io yet."
            echo "Publish tga-core first (tag: tga-core-v*) before publishing tga-collect."
            exit 1
          fi

      # ── Quality gates ─────────────────────────────────────────────────────
      - name: Dry-run publish gate
        run: cargo publish --dry-run -p tga-collect

      - name: Clippy gate
        run: cargo clippy -p tga-collect -- -D warnings

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Publish tga-collect
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry-run mode: skipping actual publish (dry-run gate already passed above)"
          else
            cargo publish -p tga-collect --no-verify
          fi
