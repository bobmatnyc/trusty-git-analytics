# GitFlow Analytics Configuration for Duetto Contractor Analysis
# Created: 2026-02-25
# Updated: 2026-02-26 - Fixed to use absolute paths

version: "1.0"
aliases_file: "/Users/masa/Duetto/repos/duetto-aliases.yaml"
profile: balanced

# GitHub Configuration
github:
  token: "${GITHUB_TOKEN}"

# Repository Configuration - Key repos where contractors work
# Using absolute paths to avoid path resolution issues (see issue #16)
repositories:
  - name: "duetto-frontend"
    path: "/Users/masa/Duetto/repos/duetto-frontend"
    branch: "develop"
  - name: "datapipelines"
    path: "/Users/masa/Duetto/repos/datapipelines"
    branch: "main"
  - name: "pricerator"
    path: "/Users/masa/Duetto/repos/pricerator"
    branch: "develop"

# Analysis settings
analysis:
  ml_categorization:
    enabled: false  # Just need commit counts

# Classification: use Duetto-specific rules on top of built-in defaults
classification:
  rules_file: "./configs/duetto-rules.yaml"

# Output settings
output:
  directory: "/Users/masa/Duetto/CTO/projects/people/contractors/gitflow-reports"
  formats:
    - csv
    - markdown

# Cache settings
cache:
  directory: "/Users/masa/Duetto/repos/.gitflow-cache"
